<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!--
      Discoverability (search + social embeds).
      After the first deploy, replace BOTH occurrences of the placeholder domain
      below with your real GitHub Pages URL (e.g. https://yourname.github.io/gitgame/).
    -->
    <title>Hidden Repo Hunter — a GitHub game to find underrated open-source repos</title>
    <meta
      name="description"
      content="Delve a pixel dungeon and unearth real, underrated GitHub repositories. Answer shrine quizzes about hidden-gem open-source projects, dodge bugs, then star the repos you rescue. Free browser game — no install."
    />
    <meta
      name="keywords"
      content="GitHub game, open source discovery, underrated repositories, hidden gems, low star repos, find good repos, open source game, browser game, pixel dungeon, star repos"
    />
    <meta name="robots" content="index, follow" />
    <!-- Force any http:// subresource/page request to https:// — prevents "Not secure" mixed content on TLS hosts -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="theme-color" content="#0b0e12" />
    <!-- UPDATE after deploy — see the comment at the top of <head> -->
    <link rel="canonical" href="https://sameer-softeng.github.io/gitgame/" />

    <!-- Open Graph: how link previews render on X/Twitter, Discord, Telegram, LinkedIn… -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hidden Repo Hunter" />
    <meta property="og:title" content="Hidden Repo Hunter — find underrated GitHub repos" />
    <meta
      property="og:description"
      content="A pixel dungeon where every gem is a real, low-star open-source repo that deserves hype. Play free in your browser."
    />
    <meta property="og:image" content="https://sameer-softeng.github.io/gitgame/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art dungeon crawler promoting underrated open-source repositories" />
    <meta property="og:url" content="https://sameer-softeng.github.io/gitgame/" />

    <!-- X / Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hidden Repo Hunter — find underrated GitHub repos" />
    <meta
      name="twitter:description"
      content="A pixel dungeon where every gem is a real, low-star open-source repo that deserves hype. Play free in your browser."
    />
    <meta name="twitter:image" content="https://sameer-softeng.github.io/gitgame/og-card.png" />

    <!-- Structured data: makes the game eligible for rich results in search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Hidden Repo Hunter",
        "description": "A browser dungeon-crawl game where every gem and shrine is a real, underrated open-source GitHub repository. Explore the vault, answer quizzes about hidden-gem projects, dodge bugs, and star the repos you rescue so they get the hype they deserve.",
        "genre": ["Roguelike", "Educational", "Puzzle"],
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any (browser)",
        "playMode": "SinglePlayer",
        "inLanguage": "en",
        "accessibilityFeature": "keyboard-only play",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "keywords": "GitHub, open source, underrated repos, hidden gems, discovery game"
      }
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d1322'/><rect x='5' y='3' width='6' height='2' fill='%236ee7ff'/><rect x='3' y='5' width='10' height='4' fill='%234ecbe8'/><rect x='5' y='9' width='6' height='2' fill='%233aaecf'/></svg>" />
  </head>
  <body>
    <div id="root">
      <noscript>
        <h1>Hidden Repo Hunter</h1>
        <p>A browser game about discovering underrated open-source GitHub repositories. This game needs JavaScript enabled — turn it on and delve the vault!</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
